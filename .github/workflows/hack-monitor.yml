name: hack-monitor

# Daily DeFi hack monitor. Pulls recent threats from a curated Slack
# triage channel, runs each through Claude to judge whether it's relevant
# to this codebase, and opens a GitHub issue per hack (or comments on an
# existing issue if the new report looks like a duplicate). Seen IDs are
# persisted in .github/security/seen-hacks.json via actions/cache so each
# run only processes new items — no commits back to the default branch.
#
# Philosophy: notification-only. Nothing on-chain. No auto-pause, no key
# rotation, no merges. The workflow never fails on missing secrets — each
# fetcher returns [] if its API is unavailable.

on:
  schedule:
    # 13:00 UTC daily — after US/EU trading hours open, before APAC close
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: hack-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic

      - name: Restore seen-hacks cache
        uses: actions/cache/restore@v4
        with:
          path: .github/security/seen-hacks.json
          key: seen-hacks-${{ github.run_id }}
          restore-keys: |
            seen-hacks-

      - name: Run hack monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ALLOWED_AUTHORS: ${{ secrets.SLACK_ALLOWED_AUTHORS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_HACKS_PER_RUN: '5'
          LOOKBACK_DAYS: '7'
        run: python3 scripts/hack_monitor.py

      - name: Save seen-hacks cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/security/seen-hacks.json
          key: seen-hacks-${{ github.run_id }}
